<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Курсы — Татьяна Желиховская</title>
  <meta name="description" content="Мини-курсы Татьяны Желиховской: песни, мультики, фото, рилс и сайты." />
  <meta http-equiv="refresh" content="0; url=index.html#courses" />
  <link rel="canonical" href="https://tatianaanatolievnadta-ops.github.io/TatianaZhelihovskaya/index.html#courses" />
  <script>location.replace("index.html#courses");</script>
</head>
<body>
  <p style="font-family:system-ui;padding:24px">Переход к мини-курсам… <a href="index.html#courses">Открыть</a></p>

  <div id="cookie-banner" class="tj-cookie-banner" role="dialog" aria-label="Уведомление о cookie" hidden>
    <p class="tj-cookie-text">
      Мы используем cookie для работы сайта и статистики.
      Продолжая пользоваться сайтом, вы соглашаетесь с
      <a href="cookies.html">политикой cookie</a>
      и
      <a href="privacy.html">политикой конфиденциальности</a>.
    </p>
    <button type="button" id="cookie-accept" class="tj-cookie-btn">Понятно</button>
  </div>
  <style>
    .tj-cookie-banner{
      position:fixed;z-index:90;
      left:max(.75rem,env(safe-area-inset-left));
      right:max(.75rem,env(safe-area-inset-right));
      bottom:max(.75rem,env(safe-area-inset-bottom));
      max-width:26rem;margin:0 auto;
      padding:1rem 1.1rem 1.05rem;
      border-radius:16px;
      border:1px solid rgba(227,178,60,.45);
      background:rgba(6,43,41,.96);
      backdrop-filter:blur(12px);
      box-shadow:0 12px 40px rgba(0,0,0,.45);
      font-family:Manrope,system-ui,sans-serif;
      color:rgba(251,247,239,.78);
    }
    .tj-cookie-banner[hidden]{display:none!important}
    @media (min-width:720px){
      .tj-cookie-banner{left:auto;right:max(.9rem,env(safe-area-inset-right));margin:0;max-width:22rem}
    }
    .tj-cookie-text{margin:0;font-size:.82rem;line-height:1.55}
    .tj-cookie-text a{color:#f3d27a;text-decoration:underline;text-underline-offset:2px}
    .tj-cookie-btn{
      display:block;width:100%;margin-top:.85rem;
      border:none;border-radius:999px;cursor:pointer;
      padding:.7rem 1rem;
      font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
      color:#062b29;
      background:linear-gradient(135deg,#e3b23c,#f3d27a);
    }
    .tj-cookie-btn:hover{filter:brightness(1.05)}
  </style>
  <script>
  (function(){
    var key='tj-cookie-accepted';
    var banner=document.getElementById('cookie-banner');
    var btn=document.getElementById('cookie-accept');
    if(!banner) return;
    try{ if(!localStorage.getItem(key)) banner.hidden=false; }catch(e){ banner.hidden=false; }
    if(btn){ btn.addEventListener('click',function(){ try{ localStorage.setItem(key,'1'); }catch(e){} banner.hidden=true; }); }
  })();
  </script>

</body>
</html>
